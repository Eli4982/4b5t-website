<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>4b5t</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      color: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #aaaaaa;
      margin-bottom: 30px;
    }
    .ip-box {
      background-color: #111;
      border: 1px solid #222;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
    }
    .ip-box:hover {
      background-color: #161616;
    }
    .links {
      margin-top: 25px;
    }
    .links a {
      color: #888;
      text-decoration: none;
      margin: 0 10px;
      font-size: 0.95rem;
    }
    .links a:hover {
      color: #fff;
    }
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>4b5t</h1>
    <div class="subtitle">
      Anarchy Minecraft Server — No Rules, No Resets
    </div>
    <div class="ip-box" onclick="copyIP()">
      IP: <strong>mc.4b5t.org</strong><br>
      <small>(click to copy)</small>
    </div>
    <div class="links">
      <a href="/rules">Rules</a>
      <a href="/map">Map</a>
      <a href="/discord">Discord</a>
      <a href="/status">Status</a>
    </div>
    <footer>
      Minecraft Java Edition
    </footer>
  </div>
  <script>
    function copyIP() {
      navigator.clipboard.writeText("mc.4b5t.org");
      alert("Server IP copied!");
    }
  </script>
</body>
</html>
